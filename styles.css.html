<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ribosoom Runner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="hero">
      <div class="logo"><i></i><i></i></div>
      <h1>Ribosoom <span>Runner</span></h1>
      <p class="sub">Eiwitsynthese, mutaties en splicing</p>
    </div>

    <div id="menu">
      <div class="card">
        <label>Naam<input type="text" id="nm" maxlength="30"></label>
        <label>Klas</label>
        <div class="row" id="kls" style="margin-top:6px">
          <button class="s" data-k="4 havo">4 havo</button>
          <button class="s" data-k="5 havo">5 havo</button>
          <button class="s" data-k="4 vwo">4 vwo</button>
          <button class="s" data-k="5 vwo">5 vwo</button>
          <button class="s" data-k="6 vwo">6 vwo</button>
        </div>
      </div>
      <div class="bin">[Binas Tabel 71C vereist]</div>
      <div id="lv">
        <label class="lvc">
          <input type="radio" name="lv" value="1" checked>
          <b>Level 1: Basissynthese &amp; tRNA</b>
          <span>Transcriptie, anticodons en translatie</span>
        </label>
        <label class="lvc">
          <input type="radio" name="lv" value="2">
          <b>Level 2: Mutaties &amp; genetische fouten</b>
          <span>Gemuteerd DNA en mutatie-analyse</span>
        </label>
        <label class="lvc">
          <input type="radio" name="lv" value="3">
          <b>Level 3: Eukaryotische pre-mRNA verwerking</b>
          <span>Introns, exons en alternatieve splicing</span>
        </label>
        <label class="lvc">
          <input type="radio" name="lv" value="4">
          <b>Level 4: Bosslevel - sikkelcelanemie</b>
          <span>Casus waarin alle thema's samenkomen</span>
        </label>
      </div>
      <button class="big" id="st">Start spel</button>
      <div class="row" style="margin-top:14px">
        <button class="s" id="pr" style="flex:1">Oefenvragen</button>
        <button class="s" id="kk" style="flex:1">Klassement</button>
      </div>
      <div class="card hide" id="pc">
        <b>Kies thema's (geen punten, geen timer)</b>
        <label class="o"><input type="checkbox" value="tr" checked> Transcriptie &amp; tRNA</label>
        <label class="o"><input type="checkbox" value="sp" checked> Splicing (Introns/Exons)</label>
        <label class="o"><input type="checkbox" value="tl" checked> Translatie</label>
        <label class="o"><input type="checkbox" value="mu" checked> Mutaties</label>
        <button id="ps">Start oefenen</button>
      </div>
      <p id="msg" class="no"></p>
    </div>

    <div id="play" class="hide">
      <div class="top">
        <button class="x" id="stop">Stop Game</button>
        <button class="s hide" id="back">Menu</button>
        <div class="pgw" id="pgw"><div id="pg"></div></div>
        <span class="stat" id="stk">Reeks <b id="sk">0</b></span>
        <span class="stat" id="sct">Score <b id="sc">0</b></span>
        <span class="stat" id="tw"><b id="tm">00:00</b></span>
      </div>
      <div class="m" id="info"></div>
      <div id="tk"></div>
      <div class="dock" id="dock"></div>
    </div>

    <div id="res" class="hide"></div>
    <div id="lb" class="hide"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
